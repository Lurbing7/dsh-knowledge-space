name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Verify the published file list
        run: npm pack --dry-run --json > pack.json && node -e "const p=require('./pack.json')[0];const f=p.files.map(x=>x.path);const need=['index.js','client.js','cordis.patch.yml','icon.svg','locale/en.json','locale/zh.json','docs/DETAIL.md','host/api.js'];const miss=need.filter(n=>!f.includes(n));if(miss.length){console.error('missing from package:',miss);process.exit(1)}console.log('package files ok:',f.length)"
